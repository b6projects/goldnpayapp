spring:
  datasource:
    # one database per Spring context, so the schema script never runs twice on the same database
    url: jdbc:h2:mem:ops${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      # Core owns the schema. Reuse its migration so a drift between the two servers fails these tests.
      schema-locations: file:../gpscoreserver/src/main/resources/db/migration/V1__baseline.sql
  mail:
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  mail:
    backoff-ms: 10
  telegram:
    polling-enabled: false
  schedule:
    enabled: false
