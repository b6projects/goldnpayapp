<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${subject}">GoldNPay</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;font-family:'Segoe UI',Arial,sans-serif;color:#2b2b2b;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center" style="padding:24px 12px;">
            <table role="presentation" width="520" cellpadding="0" cellspacing="0"
                   style="width:100%;max-width:520px;border:1px solid #e6dfcc;border-radius:8px;">
                <!-- header: compact for receipts, codes and security notices -->
                <tr>
                    <td style="padding:16px 24px;border-bottom:3px solid #c9a227;">
                        <img th:src="${brand.logoUrl}" th:alt="${brand.name}" height="28"
                             style="display:inline-block;border:0;vertical-align:middle;"/>
                        <span th:text="${brand.name}"
                              style="font-size:18px;font-weight:600;color:#7a5c00;vertical-align:middle;margin-left:6px;">GoldNPay</span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px;font-size:16px;line-height:1.55;">
                        <div th:utext="${content}"></div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:14px 24px;font-size:12px;color:#6b6b6b;border-top:1px solid #eee;">
                        This is an automated message from <span th:text="${brand.name}">GoldNPay</span>. Please do not
                        share codes or passwords with anyone. Questions? <span th:text="${brand.contact}">support</span>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
