<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${subject}">GoldNPay</title>
</head>
<body style="margin:0;padding:0;background:#f4f1ea;font-family:'Segoe UI',Arial,sans-serif;color:#2b2b2b;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ea;">
    <tr>
        <td align="center" style="padding:24px 12px;">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="width:100%;max-width:600px;background:#ffffff;border-radius:8px;overflow:hidden;">
                <!-- header -->
                <tr>
                    <td style="background:#7a5c00;padding:20px 28px;">
                        <a th:href="${brand.siteUrl}" style="text-decoration:none;">
                            <img th:src="${brand.logoUrl}" th:alt="${brand.name}" height="36"
                                 style="display:inline-block;border:0;vertical-align:middle;"/>
                            <span th:text="${brand.name}"
                                  style="color:#ffe9a8;font-size:20px;font-weight:600;vertical-align:middle;margin-left:8px;">GoldNPay</span>
                        </a>
                    </td>
                </tr>
                <!-- body written by Core -->
                <tr>
                    <td style="padding:28px;font-size:16px;line-height:1.55;">
                        <div th:utext="${content}"></div>
                    </td>
                </tr>
                <!-- footer -->
                <tr>
                    <td style="background:#faf7ef;padding:18px 28px;font-size:12px;color:#6b6b6b;line-height:1.5;">
                        <div th:text="${brand.address}">GoldNPay</div>
                        <div>Need help? <a th:href="'mailto:' + ${brand.contact}" th:text="${brand.contact}"
                                           style="color:#7a5c00;">support</a></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
