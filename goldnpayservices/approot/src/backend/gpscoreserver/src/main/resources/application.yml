# No secrets here, not even defaults: every secret is ${ENV_VAR} so the server
# fails to start when one is missing. The active profile (dev/uat/prd) is set
# from ENV by the Docker entrypoint (-Dspring.profiles.active=<env lower-case>).
spring:
  application:
    name: gps-core-server
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_SCHEMA}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionTimeZone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Kolkata
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}

app:
  env: ${ENV}
  jwt:
    secret: ${JWT_SECRET_KEY}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:86400000}
  security:
    core-to-ops-api-key: ${CORE_TO_OPS_API_KEY}
    ops-to-core-api-key: ${OPS_TO_CORE_API_KEY}
    field-encryption-key: ${FIELD_ENCRYPTION_KEY}
    auth-rate-limit-per-minute: 20
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  ops:
    base-url: ${OPS_BASE_URL}
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
    retries: 2
  storage:
    volume-home: ${VOLUME_HOME}
    kyc-folder: ${KYC_FOLDER:kyc/}
    images-volume: ${IMAGES_VOLUME:images/}
    hm-images-volume: ${HM_IMAGES_VOLUME:homeimages/}
  otp:
    ttl-minutes: 5
    max-per-hour: 5
    max-attempts: 5
  lockout:
    max-failures: 5
    window-minutes: 15
    lock-minutes: 15
  telegram:
    link-code-ttl-minutes: 10
